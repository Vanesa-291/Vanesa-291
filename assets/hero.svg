    <clipPath id="c7"><rect x="98" y="308" width="0" height="30"><animate attributeName="width" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0.00000;0.70417;0.70625;0.95000;1.00000" values="0.0;11.0;20.0;0.0;0.0"/></rect></clipPath>
  </defs>
  <style>
    .sans { font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .a1 { animation: drift 18s ease-in-out infinite alternate; }
    .a2 { animation: drift 22s ease-in-out -7s infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(34px,-20px); } }
    .f1 { animation: float 9s ease-in-out infinite; }
    .f2 { animation: float 11s ease-in-out -4s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#canvas)">
    <rect width="860" height="420" fill="#0b0b14"/>
    <g filter="url(#blur)">
      <circle class="a1" cx="170" cy="90"  r="150" fill="#8b7bff" opacity=".5"/>
      <circle class="a2" cx="700" cy="340" r="150" fill="#ff7ab6"   opacity=".36"/>
      <circle class="a1" cx="780" cy="70"  r="100" fill="#5ad1e6"   opacity=".26"/>
    </g>
    <rect width="860" height="420" fill="url(#dots)"/>

    <!-- tarjeta de vidrio -->
    <rect x="40" y="46" width="780" height="328" rx="20" fill="#0d0d1a" opacity=".55"/>
    <rect x="40" y="46" width="780" height="328" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
    <line x1="40" y1="92" x2="820" y2="92" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="68" cy="69" r="5" fill="#ff6b7a" opacity=".85"/>
    <circle cx="87" cy="69" r="5" fill="#ffc15e" opacity=".85"/>
    <circle cx="106" cy="69" r="5" fill="#5bd68a" opacity=".85"/>
    <text class="mono" x="430" y="73" font-size="12.5" fill="#7d7a99" text-anchor="middle" letter-spacing=".5">vanesa.js</text>

    <!-- números de línea -->
        <text class="mono" x="78" y="118" font-size="13" fill="#4b4968" text-anchor="end">1</text>
    <text class="mono" x="78" y="148" font-size="13" fill="#4b4968" text-anchor="end">2</text>
    <text class="mono" x="78" y="178" font-size="13" fill="#4b4968" text-anchor="end">3</text>
    <text class="mono" x="78" y="208" font-size="13" fill="#4b4968" text-anchor="end">4</text>
    <text class="mono" x="78" y="238" font-size="13" fill="#4b4968" text-anchor="end">5</text>
    <text class="mono" x="78" y="268" font-size="13" fill="#4b4968" text-anchor="end">6</text>
    <text class="mono" x="78" y="298" font-size="13" fill="#4b4968" text-anchor="end">7</text>
    <text class="mono" x="78" y="328" font-size="13" fill="#4b4968" text-anchor="end">8</text>

    <!-- código que se escribe -->
    <g>
      <animate attributeName="opacity" dur="24.0s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0;0.90000;0.95000;1" values="1;1;0;1"/>
            <text class="mono" x="100" y="118" font-size="15" xml:space="preserve" clip-path="url(#c0)"><tspan fill="#b69cff">const </tspan><tspan fill="#7fdcf0">vanesa</tspan><tspan fill="#7d7a99"> = {</tspan></text>
      <text class="mono" x="100" y="148" font-size="15" xml:space="preserve" clip-path="url(#c1)"><tspan fill="#e7e5ff">  rol</tspan><tspan fill="#7d7a99">: </tspan><tspan fill="#ffb3d1">"Desarrolladora Frontend"</tspan><tspan fill="#7d7a99">,</tspan></text>
      <text class="mono" x="100" y="178" font-size="15" xml:space="preserve" clip-path="url(#c2)"><tspan fill="#e7e5ff">  ubicacion</tspan><tspan fill="#7d7a99">: </tspan><tspan fill="#ffb3d1">"Mendoza, Argentina"</tspan><tspan fill="#7d7a99">,</tspan></text>
      <text class="mono" x="100" y="208" font-size="15" xml:space="preserve" clip-path="url(#c3)"><tspan fill="#e7e5ff">  enfoque</tspan><tspan fill="#7d7a99">: </tspan><tspan fill="#ffb3d1">"Frontend → Full Stack"</tspan><tspan fill="#7d7a99">,</tspan></text>
      <text class="mono" x="100" y="238" font-size="15" xml:space="preserve" clip-path="url(#c4)"><tspan fill="#e7e5ff">  stack</tspan><tspan fill="#7d7a99">: [</tspan><tspan fill="#ffb3d1">"JavaScript"</tspan><tspan fill="#7d7a99">, </tspan><tspan fill="#ffb3d1">"Node.js"</tspan><tspan fill="#7d7a99">, </tspan><tspan fill="#ffb3d1">"Express"</tspan><tspan fill="#7d7a99">, </tspan><tspan fill="#ffb3d1">"MongoDB"</tspan><tspan fill="#7d7a99">],</tspan></text>
      <text class="mono" x="100" y="268" font-size="15" xml:space="preserve" clip-path="url(#c5)"><tspan fill="#e7e5ff">  aprendiendo</tspan><tspan fill="#7d7a99">: [</tspan><tspan fill="#ffb3d1">"Autenticación"</tspan><tspan fill="#7d7a99">, </tspan><tspan fill="#ffb3d1">"Testing"</tspan><tspan fill="#7d7a99">],</tspan></text>
      <text class="mono" x="100" y="298" font-size="15" xml:space="preserve" clip-path="url(#c6)"><tspan fill="#e7e5ff">  objetivo</tspan><tspan fill="#7d7a99">: </tspan><tspan fill="#ffb3d1">"Crecer construyendo proyectos reales"</tspan><tspan fill="#7d7a99">,</tspan></text>
      <text class="mono" x="100" y="328" font-size="15" xml:space="preserve" clip-path="url(#c7)"><tspan fill="#7d7a99">};</tspan></text>
      <g opacity="0">
        <animate attributeName="opacity" dur="24.0s" repeatCount="indefinite" calcMode="discrete"
                 keyTimes="0;0.70625;0.90000;1" values="0;1;0;0"/>
        <rect class="blink" x="121.0" y="313.0" width="8" height="19" rx="1.5" fill="#8b7bff"/>
      </g>
    </g>

    <!-- chips flotantes -->
    <g class="f1">
      <rect x="668" y="24" width="112" height="34" rx="17" fill="#14142a" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="690" cy="41" r="4" fill="#5bd68a"/>
      <text class="mono" x="703" y="46" font-size="13.5" fill="#e7e5ff">Node.js</text>
    </g>
    <g class="f2">
      <rect x="82" y="352" width="124" height="34" rx="17" fill="#14142a" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="104" cy="369" r="4" fill="#ff7ab6"/>
      <text class="mono" x="117" y="374" font-size="13.5" fill="#e7e5ff">MongoDB</text>
    </g>
  </g>
</svg>
