<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="t d">
  <title id="t">Tarjeta animada con un resumen de perfil escrito como código</title>
  <desc id="d">Se escribe un objeto JavaScript con rol, ubicación, enfoque, stack y objetivos de Vanesa Feris.</desc>
  <defs>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
