<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="t">
  <title id="t">Vanesa Feris — Desarrolladora Junior · de Frontend a Full Stack</title>
  <defs>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e4ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".07"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="260" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .a1 { animation: drift 16s ease-in-out infinite alternate; }
    .a2 { animation: drift 20s ease-in-out -6s infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px,-18px); } }
    .in1 { animation: rise 1.2s cubic-bezier(.2,.7,.2,1) .1s both; }
    .in2 { animation: rise 1.2s cubic-bezier(.2,.7,.2,1) .35s both; }
    .in3 { animation: rise 1.2s cubic-bezier(.2,.7,.2,1) .6s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .draw { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s cubic-bezier(.2,.7,.2,1) .8s both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="#0b0b14"/>
    <g filter="url(#blur)">
      <circle class="a1" cx="820" cy="60"  r="130" fill="#8b7bff" opacity=".55"/>
      <circle class="a2" cx="700" cy="230" r="110" fill="#ff7ab6"   opacity=".38"/>
      <circle class="a1" cx="960" cy="230" r="90"  fill="#5ad1e6"   opacity=".28"/>
    </g>
    <rect width="1000" height="260" fill="url(#dots)"/>

    <text class="sans in1" x="64" y="92" font-size="17" fill="#a9a5c8" letter-spacing="3">HOLA, SOY</text>
    <text class="sans in2" x="62" y="158" font-size="68" font-weight="700" fill="url(#name)" letter-spacing="-2">Vanesa Feris</text>
    <rect class="draw" x="64" y="178" width="96" height="3" rx="1.5" fill="url(#line)"/>
    <text class="sans in3" x="64" y="214" font-size="22" fill="#a9a5c8">Desarrolladora Junior <tspan fill="#7d7a99">·</tspan> de Frontend a Full Stack</text>
    <text class="mono in3" x="64" y="240" font-size="14" fill="#7d7a99" letter-spacing=".5">Node.js  ·  Express  ·  MongoDB  ·  JavaScript</text>
  </g>
</svg>
